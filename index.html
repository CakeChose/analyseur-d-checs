<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analyseur d'échecs</title>
    <meta name="theme-color" content="#4a7c59" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand"><img src="/icon-192.png" alt="" width="26" height="26" />Analyseur</span>
      <nav class="tabs">
        <button id="tab-analyse" class="tab active">Analyse</button>
        <button id="tab-profil" class="tab">Profil</button>
      </nav>
      <span class="spacer"></span>
      <button id="open-import" class="primary">Importer une partie</button>
    </header>

    <!-- Fenêtre d'import : parties en ligne ou PGN collé -->
    <dialog id="import-dialog" class="import-dialog">
      <form method="dialog" class="dialog-head">
        <h2>Importer une partie</h2>
        <button aria-label="Fermer" title="Fermer">✕</button>
      </form>
      <section>
        <h3>Depuis chess.com ou Lichess</h3>
        <div class="online-form">
          <select id="online-site">
            <option value="chesscom">chess.com</option>
            <option value="lichess">Lichess</option>
          </select>
          <input id="online-user" type="text" placeholder="Pseudo" autocomplete="off" />
          <button id="online-search">Chercher</button>
        </div>
        <p id="online-status" class="muted"></p>
        <ul id="online-games" class="online-games"></ul>
      </section>
      <section>
        <h3>Coller un PGN</h3>
        <textarea id="pgn" rows="6" placeholder="1. e4 e5 2. Nf3 …"></textarea>
        <button id="load">Charger</button>
        <p id="error" class="error"></p>
      </section>
    </dialog>

    <!-- Page profil : analyse en lot des parties chess.com et synthèse -->
    <main id="view-profil" class="profile" hidden>
      <section class="card wide profile-form">
        <label>Pseudo chess.com <input id="profile-user" type="text" autocomplete="off" /></label>
        <label
          >Parties
          <select id="profile-count">
            <option>20</option>
            <option selected>50</option>
            <option>100</option>
          </select>
        </label>
        <label
          >Cadence
          <select id="profile-speed">
            <option value="">Toutes</option>
            <option value="bullet">Bullet</option>
            <option value="blitz">Blitz</option>
            <option value="rapid">Rapide</option>
            <option value="daily">Par jour</option>
          </select>
        </label>
        <label title="Un moteur par cœur du processeur va plus vite, mais l'ordi chauffe davantage"
          >Moteurs <input id="profile-engines" type="number" min="1" max="16"
        /></label>
        <button id="profile-run" class="primary">Analyser mes parties</button>
        <button id="profile-stop" hidden>Pause</button>
        <span class="spacer"></span>
        <button id="profile-export" title="Télécharger un fichier avec toutes les analyses">Exporter</button>
        <label class="button" title="Ajouter les analyses d'un fichier exporté"
          >Importer <input id="profile-import" type="file" accept=".json,application/json" hidden
        /></label>
      </section>
      <div id="profile-progress" class="progress wide" hidden><div id="profile-progress-fill"></div></div>
      <p id="profile-status" class="muted wide"></p>
      <div id="profile-summary" class="profile-grid"></div>
    </main>

    <main id="view-analyse" class="app">
      <!-- Colonne de gauche : la partie, l'analyse, le bilan -->
      <section class="game-col">
        <div>
          <div id="game-info" class="game-info"></div>
          <div id="opening" class="muted"></div>
        </div>
        <div class="analyse-bar">
          <button id="analyse" class="primary">Analyser la partie</button>
          <label class="muted"
            >Profondeur
            <select id="depth">
              <option value="12">12 (rapide)</option>
              <option value="16" selected>16</option>
              <option value="20">20 (précis)</option>
            </select>
          </label>
        </div>
        <div id="progress" class="progress" hidden><div id="progress-fill"></div></div>
        <div id="report" class="report" hidden></div>
      </section>

      <!-- Colonne centrale : l'échiquier, encadré par les deux joueurs -->
      <section class="board-col">
        <div id="player-top" class="player"></div>
        <div class="board-row">
          <div id="evalbar" class="evalbar" title="Évaluation">
            <div id="evalbar-fill" class="evalbar-fill"></div>
            <span id="evalbar-text" class="evalbar-text"></span>
          </div>
          <div id="board" class="board"></div>
        </div>
        <div id="player-bottom" class="player"></div>
        <div class="nav">
          <button id="first" title="Début (Origine)" aria-label="Début">⏮</button>
          <button id="prev" title="Coup précédent (←)" aria-label="Coup précédent">◀</button>
          <button id="next" title="Coup suivant (→)" aria-label="Coup suivant">▶</button>
          <button id="last" title="Fin" aria-label="Fin">⏭</button>
          <button id="flip" title="Retourner l'échiquier" aria-label="Retourner l'échiquier">⇅</button>
          <button id="key-prev" title="Erreur précédente (imprécisions exclues)">‹ Erreur</button>
          <button id="key-next" title="Erreur suivante (imprécisions exclues)">Erreur ›</button>
        </div>
        <p class="hint muted">
          Joue un coup sur l'échiquier pour essayer une variante · ↑ pour revenir à la partie
        </p>
        <div id="graph" class="graph"></div>
      </section>

      <!-- Colonne de droite : le coup, le moteur, la liste des coups -->
      <section class="side-col">
        <div id="review" class="review" hidden></div>
        <div class="engine">
          <label class="engine-head">
            <input type="checkbox" id="engine-on" checked />
            Stockfish 19 <span id="engine-status" class="muted"></span>
          </label>
          <ol id="engine-lines" class="engine-lines"></ol>
        </div>
        <div id="moves" class="moves"></div>
      </section>
    </main>

    <!-- Téléphone : navigation en bas, à portée du pouce -->
    <nav class="bottom-nav">
      <button id="bn-analyse" class="active"><span aria-hidden="true">♞</span>Analyse</button>
      <button id="bn-import"><span aria-hidden="true">⤓</span>Importer</button>
      <button id="bn-profil"><span aria-hidden="true">◔</span>Profil</button>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
