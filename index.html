<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analyseur d'échecs</title>
  </head>
  <body>
    <main class="app">
      <section class="board-col">
        <div id="board" class="board"></div>
        <div class="nav">
          <button id="first" title="Début">⏮</button>
          <button id="prev" title="Coup précédent (←)">◀</button>
          <button id="next" title="Coup suivant (→)">▶</button>
          <button id="last" title="Fin">⏭</button>
          <button id="flip" title="Retourner l'échiquier">⇅</button>
        </div>
      </section>
      <section class="side-col">
        <div id="game-info" class="game-info"></div>
        <ol id="moves" class="moves"></ol>
        <details class="import" open>
          <summary>Importer une partie (PGN)</summary>
          <textarea id="pgn" rows="8" placeholder="Colle ici le PGN de ta partie"></textarea>
          <button id="load">Charger</button>
          <p id="error" class="error"></p>
        </details>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
